<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mes recettes</title>
  <meta name="theme-color" content="#F3F5F2">
  <meta name="description" content="Mon livre de recettes : Thermomix, Cookeo et cuisine classique.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recettes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Applique le thème avant l'affichage (évite un flash blanc en mode sombre)
    try {
      var t = JSON.parse(localStorage.getItem('rec:theme') || '"auto"');
      if (t === 'sombre' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" class="nav" aria-label="Navigation principale"></nav>
  <div id="feuille" class="feuille-fond" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
